[project]
name = "voice-sidecar"
version = "0.1.0"
description = "The sidecar daemon of the voice mod: owns the microphone, the speaker and the speech models."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sounddevice>=0.5.6",
]

[project.scripts]
voice-sidecar = "voice_sidecar.cli:main"

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.6.1",
]
piper = [
    "piper-tts>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sounddevice", "kokoro_onnx", "numpy", "piper", "piper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/voice_sidecar"]
pytest_add_cli_args_test_selection = ["tests/"]
