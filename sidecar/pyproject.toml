[project]
name = "voice-sidecar"
version = "0.1.0"
description = "The sidecar daemon of the voice mod: owns the microphone, the speaker and the speech models."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
voice-sidecar = "voice_sidecar.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/voice_sidecar"]
pytest_add_cli_args_test_selection = ["tests/"]
